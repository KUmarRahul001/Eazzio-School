name: eazzio_school
description: "Eazzio School - Single Mobile App for Student & Teacher Portals"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking & HTTP
  dio: ^5.7.0

  # State Management & DI
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Local DB / Caching
  sqflite: ^2.4.1
  path: ^1.9.0

  # UI / Formatting / Helpers
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_pdfview: ^1.3.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
